name: CI

on:
  push:
    branches: [main]
  pull_request:
  # PR を開く前のブランチはこれで回す。Actions タブの Run workflow から
  # 任意のブランチを選べる（ワークフロー定義は選んだブランチのものが使われる）。
  workflow_dispatch:

concurrency:
  # PR が開いていると push と pull_request で二重に走りうる。ref ではなく
  # ref_name を使う。push では ref が refs/heads/foo になり pull_request 側の
  # head_ref（foo）と一致しないが、ref_name なら両方 foo になって同じグループに入る。
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # toolchain 入力はあえて書かない。リポジトリ直下に rust-toolchain.toml が
      # あり toolchain 入力が無いときは、このアクションがそのファイルの内容を
      # そのままインストールする。バージョンとターゲットの定義を 1 箇所に
      # 保つため、ここに版を書いてはいけない。
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: verify toolchain
        run: scripts/verify-toolchain.sh

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # 「どの言語に対応しているか」は 2 箇所にある。crates/codegloss-parser の
      # レジストリ（LSP の languageId）と editors/zed/extension.toml の languages
      # （Zed の言語名）で、**別ワークスペースなのでどちらのビルドも相手を見ない**。
      # 片方だけ足すと両方向に静かに壊れる: パーサだけ足すと Zed がそのバッファに
      # codegloss を付けないので何も出ず、extension.toml だけ足すと
      # from_lsp_language_id が None を返して「コメントが無い文書」として黙る。
      # どちらもエラーにならないので、ここで突き合わせる（#63）。
      - name: check the supported-language lists
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "NG: $1" >&2; exit 1; }

          # レジストリはコンパイラに吐かせる。languages.rs を grep すると
          # 「コードの字面」と比べることになり、バイナリの挙動とは別物になる。
          parser=$(cargo run -q -p codegloss-parser --example languages \
            | tr 'A-Z' 'a-z' | sed '/^$/d' | sort)

          # languages = ["Rust", "Go"] の中身だけを切って 1 行 1 語にする。
          # 名前は一致しない（"go" と "Go"）ので、小文字化した集合で比べる。
          extension=$(sed -n 's/^languages *= *\[\(.*\)\]$/\1/p' editors/zed/extension.toml \
            | head -1 | tr ',' '\n' | tr -d ' "' | tr 'A-Z' 'a-z' | sed '/^$/d' | sort)

          [ -n "$parser" ] || fail "codegloss-parser が対応言語を 1 つも出しませんでした"
          [ -n "$extension" ] ||
            fail "editors/zed/extension.toml の languages を読み取れませんでした"

          if [ "$parser" != "$extension" ]; then
            # 両方向とも出してから落とす。片方だけ見せると、足す先を間違える。
            only_parser=$(comm -23 <(echo "$parser") <(echo "$extension") | tr '\n' ' ')
            only_extension=$(comm -13 <(echo "$parser") <(echo "$extension") | tr '\n' ' ')
            [ -z "$only_parser" ] || echo \
              "codegloss-parser にしかない: ${only_parser}— Zed が付けないので何も出ません" >&2
            [ -z "$only_extension" ] || echo \
              "extension.toml にしかない: ${only_extension}— サーバが黙ります" >&2
            fail "対応言語の一覧がずれています"
          fi
          echo "OK: 対応言語は $(echo "$parser" | tr '\n' ' ')（parser と拡張の両方）"

  # 上の check ジョブは既定 feature で回るので、`--features candle` の裏を
  # 1 行も見ない。そこには candle.rs と marian.rs と model_pack.rs があり、
  # コンパイルも lint も型検査もされていなかった。
  #
  # とくに marian.rs は candle の models::marian のフォークで、**上流の新版と
  # diff を取れることがコピーを抱える条件**である（AGENTS.md）。3 つの変更
  # （reorder_kv_cache / エンコーダとクロスアテンションのマスク /
  # エンコーダ層の is_decoder: false）にはモデルパック不要のユニットテストが
  # 付いているのに、`mod marian` 自体が #[cfg(feature = "candle")] の裏なので
  # 一度も走っていなかった（#66）。
  #
  # check を重くするのではなく別ジョブにして並列に走らせる。check の時間は
  # 変わらないままで、ワークフローの壁時計は一番遅いジョブが決める。増えるのは
  # CI の分である。実測（4 コア、cold、3 回の中央値）: `cargo test --workspace
  # --no-run` が既定 37.9 秒、candle 付きで 73.3 秒（1.93 倍）。#60 は同じ穴の
  # 残り半分を 0.4 秒で塞げたが、こちらは candle クレートそのものが要るので、
  # その値段では買えない。
  #
  # IMPORTANT: モデルパックは取りに行かないこと。重みはこのリポジトリに置かず
  # （AGENTS.md）、120 MB の CC-BY-SA-4.0 を CI で落とす理由も無い。実モデルの
  # 要るテストは #[ignore] のままで、ignored と表示されるのが正しい。
  candle:
    name: clippy / test (candle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # check ジョブと同じ。toolchain 入力は書かない（rust-toolchain.toml が
      # 唯一の版の定義であり、ここに書くと二重管理になる）。
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # 仮想マニフェストに対する `--features candle` は、その名前の feature を
      # 持つメンバ全部に効く。codegloss-translator（marian / candle）と
      # codegloss-lsp（model_pack）の両方がここで入る。片方だけ名指しして
      # codegloss-lsp/candle と書いても同じ集合になる（あちらの candle が
      # codegloss-translator/candle を引くため）が、それは依存の向きに寄りかかる
      # 書き方で、lsp が翻訳エンジンを直に持たなくなった日に黙って translator を
      # 覆わなくなる。見たいのは「ワークスペースを candle 付きで回す」ことなので、
      # 依存ではなく feature の名前で言う。
      - name: clippy
        run: cargo clippy --workspace --all-targets --features candle -- -D warnings

      - name: test
        run: cargo test --workspace --features candle

      # 上の test が緑でも、marian のテストが 1 件も入っていなければ意味がない。
      # #60 と #66 が見つけたのはどちらも「走ると書いてあるのに走っていない」
      # テストで、required-features を足し直す・モジュールを別の cfg の裏へ移す
      # といった変更で同じことがまた起きる。そのときテストは消えず、ただ数が
      # 0 になるだけなので、ジョブは緑のままになる。名前が消えたらここで落とす。
      - name: check the fork guards ran
        shell: bash
        run: |
          set -euo pipefail
          # コードの字面ではなくテストバイナリに訊く。grep では #[cfg] で
          # 外された名前も数えてしまう。**選び方は上の test と 1 字も変えない**
          # ——`-p codegloss-translator` に絞るとワークスペース全体とは feature の
          # 統合結果が変わり、依存を積み直して実測 25 秒かかるうえ、数えるのが
          # 「さっき走ったのとは別のビルド」になる。揃えれば 0.5 秒で、走った
          # バイナリそのものに訊くことになる。
          guards=$(cargo test -q --workspace --features candle -- --list \
            | sed -n 's/^\(marian::tests::[A-Za-z0-9_]*\): test$/\1/p')
          [ -n "$guards" ] || {
            echo "NG: marian::tests が 1 件も入っていません。" >&2
            echo "    フォークの 3 つの変更を守るテストが走っていないので、" >&2
            echo "    上流と diff を取れることを確かめる手立てがありません（#66）。" >&2
            exit 1
          }
          echo "OK: フォークを守るテストが $(echo "$guards" | wc -l) 件走りました"
          echo "$guards"

  wasm:
    name: zed extension (wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # ルート直下の rust-toolchain.toml にも入っているが、editors/zed は
          # ルート直下ではないので明示しておく方が壊れにくい。
          target: wasm32-wasip2
          # このアクションのキャッシュ入力は cache-workspaces（Swatinem/rust-cache
          # の workspaces にそのまま渡される）。editors/zed はルートワークスペース
          # から exclude されているので、ここを指さないとキャッシュが当たらない。
          cache-workspaces: editors/zed

      # editors/zed はルートワークスペースから exclude されているため、
      # check ジョブの fmt / clippy では見られない。ここで見る。
      - name: fmt
        working-directory: editors/zed
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: editors/zed
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings

      # Zed のビルダと同じく、拡張ディレクトリを作業ディレクトリにして
      # wasm32-wasip2 向けにビルドする。Zed 側でだけ失敗する事故を防ぐ。
      - name: build
        working-directory: editors/zed
        run: cargo build --target wasm32-wasip2 --release

      # wasip2 はパッケージ名の `-` を `_` に正規化する。
      - name: check artifact
        run: test -f editors/zed/target/wasm32-wasip2/release/codegloss_zed.wasm

  # 上の wasm ジョブは rust-toolchain.toml の版（開発用の最新）でしかビルドしない。
  # 拡張をビルドするのは Zed のレジストリで、向こうはうちより古い rustc を使う。
  # そこで、宣言した rust-version でも通ることをここで見る。
  #
  # このジョブが捕まえるのは「rust-version を据え置いたまま、新しい版でしか
  # 通らない書き方をした」場合である。**逆は捕まえられない**：rust-version を
  # 上げてしまった場合はその版でビルドして通ってしまう。レジストリ側の rustc が
  # いくつかは、このリポジトリからは分からないため。上げるときは
  # editors/zed/Cargo.toml のコメントを読むこと。
  msrv:
    name: zed extension (msrv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版を書く場所は増やさない。Cargo.toml の rust-version をそのまま使う。
      - name: read the declared rust-version
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' editors/zed/Cargo.toml | head -1)
          [ -n "$version" ] || {
            echo "NG: editors/zed/Cargo.toml に rust-version がありません" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared rust-version: $version"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          target: wasm32-wasip2
          cache-workspaces: editors/zed

      # RUSTUP_TOOLCHAIN で明示するのが要点。これが無いと、cargo が上へ辿って
      # ルートの rust-toolchain.toml を拾い、結局そちらの版でビルドしてしまう。
      # 文字列は setup に渡したものと同じにする（`1.88` と `1.88.0` は rustup に
      # とって別のツールチェーンで、後者には wasm ターゲットが入っていない）。
      - name: build
        working-directory: editors/zed
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo build --target wasm32-wasip2 --release
