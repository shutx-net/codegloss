name: CI

on:
  push:
    branches: [main]
  pull_request:
  # **上流に新しい advisory が出るのは、こちらが何も push していない日である。**
  # 1 日 1 回 supply chain ジョブだけを走らせる（他のジョブは下の `if` で外して
  # あるので、この回に動くのは 1 つだけ）。
  schedule:
    - cron: "17 3 * * *"

  # PR を開く前のブランチはこれで回す。Actions タブの Run workflow から
  # 任意のブランチを選べる（ワークフロー定義は選んだブランチのものが使われる）。
  workflow_dispatch:

concurrency:
  # PR が開いていると push と pull_request で二重に走りうる。ref ではなく
  # ref_name を使う。push では ref が refs/heads/foo になり pull_request 側の
  # head_ref（foo）と一致しないが、ref_name なら両方 foo になって同じグループに入る。
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    # 毎日の回で見たいのは supply chain だけ。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      # toolchain 入力はあえて書かない。リポジトリ直下に rust-toolchain.toml が
      # あり toolchain 入力が無いときは、このアクションがそのファイルの内容を
      # そのままインストールする。バージョンとターゲットの定義を 1 箇所に
      # 保つため、ここに版を書いてはいけない。
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: verify toolchain
        run: scripts/verify-toolchain.sh

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      # 「どの言語に対応しているか」は 3 箇所にある。crates/codegloss-parser の
      # レジストリ、editors/zed/extension.toml の languages（Zed の言語名）、
      # editors/vscode/package.json の activationEvents（VS Code の languageId）。
      # **どれも別ワークスペースで、どのビルドも他を見ない**。片方だけ足すと
      # 両方向に静かに壊れる: パーサだけ足すと editor がそのバッファに codegloss を
      # 付けないので何も出ず、editor 側だけ足すと from_lsp_language_id が None を
      # 返して「コメントが無い文書」として黙る。どちらもエラーにならない（#63）。
      #
      # 2 つの突き合わせをする。**3 つの一覧は同じ一覧ではない**からで、
      # Zed はこのレジストリと同じ綴りを使うが、VS Code は 2 つを別の名前で呼ぶ
      # （typescriptreact / javascriptreact）。
      #
      # 1. 言語名: レジストリ ＝ Zed の languages
      # 2. id: レジストリの全 id ＝ Zed の名前 ∪ VS Code の onLanguage
      #
      # 2 が「和集合と等しい」なのが要点である。部分集合で見ると、レジストリに
      # id を足してどちらの editor にも書かなかった場合を見逃す——サーバだけが
      # 知っていて誰も送らない名前ができ、対応したつもりのまま何も出ない。
      - name: check the supported-language lists
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "NG: $1" >&2; exit 1; }

          # 両方向とも出してから落とす。片方だけ見せると、足す先を間違える。
          compare() {
            local what=$1 left=$2 right=$3 left_name=$4 right_name=$5
            [ "$left" = "$right" ] && return 0
            only_left=$(comm -23 <(echo "$left") <(echo "$right") | tr '\n' ' ')
            only_right=$(comm -13 <(echo "$left") <(echo "$right") | tr '\n' ' ')
            [ -z "$only_left" ] || echo "${left_name}にしかない: ${only_left}" >&2
            [ -z "$only_right" ] || echo "${right_name}にしかない: ${only_right}" >&2
            fail "${what}がずれています"
          }

          # レジストリはコンパイラに吐かせる。languages.rs を grep すると
          # 「コードの字面」と比べることになり、バイナリの挙動とは別物になる。
          # 出力は「言語名<TAB>id」の対。
          pairs=$(cargo run -q -p codegloss-parser --example languages)
          [ -n "$pairs" ] || fail "codegloss-parser が対応言語を 1 つも出しませんでした"
          names=$(echo "$pairs" | cut -f1 | tr 'A-Z' 'a-z' | sort -u)
          ids=$(echo "$pairs" | cut -f2 | tr 'A-Z' 'a-z' | sort -u)

          # languages = ["Rust", "Go"] の中身だけを切って 1 行 1 語にする。
          # 名前は一致しない（"go" と "Go"）ので、小文字化した集合で比べる。
          zed=$(sed -n 's/^languages *= *\[\(.*\)\]$/\1/p' editors/zed/extension.toml \
            | head -1 | tr ',' '\n' | tr -d ' "' | tr 'A-Z' 'a-z' | sed '/^$/d' | sort -u)
          [ -n "$zed" ] ||
            fail "editors/zed/extension.toml の languages を読み取れませんでした"

          # VS Code 側は package.json の activationEvents。拡張の
          # documentSelector はこれから導出されるので（src/server.ts）、
          # ここを見れば拡張がどの言語に付くかが分かる。
          vscode=$(jq -r '.activationEvents[]
            | select(startswith("onLanguage:")) | ltrimstr("onLanguage:")' \
            editors/vscode/package.json | tr 'A-Z' 'a-z' | sed '/^$/d' | sort -u)
          [ -n "$vscode" ] ||
            fail "editors/vscode/package.json の onLanguage を読み取れませんでした"

          compare "対応言語の一覧" "$names" "$zed" \
            "codegloss-parser（Zed が付けないので何も出ません）" \
            "extension.toml（サーバが黙ります）"

          claimed=$(printf '%s\n%s\n' "$zed" "$vscode" | sed '/^$/d' | sort -u)
          compare "languageId の一覧" "$ids" "$claimed" \
            "レジストリ（どの editor も送らない id です）" \
            "editor 側（サーバが黙ります）"

          echo "OK: 対応言語は $(echo "$names" | tr '\n' ' ')"
          echo "OK: languageId は $(echo "$ids" | tr '\n' ' ')（Zed と VS Code の両方で claim 済み）"

  # 上の check ジョブは既定 feature で回るので、`--features candle` の裏を
  # 1 行も見ない。そこには candle.rs と marian.rs と model_pack.rs があり、
  # コンパイルも lint も型検査もされていなかった。
  #
  # とくに marian.rs は candle の models::marian のフォークで、**上流の新版と
  # diff を取れることがコピーを抱える条件**である（AGENTS.md）。3 つの変更
  # （reorder_kv_cache / エンコーダとクロスアテンションのマスク /
  # エンコーダ層の is_decoder: false）にはモデルパック不要のユニットテストが
  # 付いているのに、`mod marian` 自体が #[cfg(feature = "candle")] の裏なので
  # 一度も走っていなかった（#66）。
  #
  # check を重くするのではなく別ジョブにして並列に走らせる。check の時間は
  # 変わらないままで、ワークフローの壁時計は一番遅いジョブが決める。増えるのは
  # CI の分である。実測（4 コア、cold、3 回の中央値）: `cargo test --workspace
  # --no-run` が既定 37.9 秒、candle 付きで 73.3 秒（1.93 倍）。#60 は同じ穴の
  # 残り半分を 0.4 秒で塞げたが、こちらは candle クレートそのものが要るので、
  # その値段では買えない。
  #
  # IMPORTANT: モデルパックは取りに行かないこと。重みはこのリポジトリに置かず
  # （AGENTS.md）、120 MB の CC-BY-SA-4.0 を CI で落とす理由も無い。実モデルの
  # 要るテストは #[ignore] のままで、ignored と表示されるのが正しい。
  candle:
    name: clippy / test (candle)
    runs-on: ubuntu-latest
    # 毎日の回で見たいのは supply chain だけ。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      # check ジョブと同じ。toolchain 入力は書かない（rust-toolchain.toml が
      # 唯一の版の定義であり、ここに書くと二重管理になる）。
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      # ログの subscriber は自前で持っている（crates/codegloss-lsp/src/logging.rs）。
      # **tracing-subscriber が戻ってきても、何一つ落ちない**——`tracing_subscriber::fmt()`
      # を 1 行書けばコンパイルは通り、テストは緑のままで、出るログの見た目すら
      # 変わらない（1 行の形は上流の既定とバイト単位で同じにしてある）。差が出るのは
      # 依存ツリーだけなので、ここで見る。
      #
      # **禁止するのは置き換えた当のものだけにする。**一緒に消えたもの
      # （tracing-subscriber なら lazy_static / matchers / nu-ansi-term /
      # sharded-slab / thread_local / tracing-log、tower-lsp-server なら
      # ls-types / fluent-uri / futures 系）は結果であって原因ではない。
      # 無関係のクレートが正当に thread_local を引いた日に落ちるのは、この検査が
      # 見たいことではない。`sha2` も入れない——あれは置き換えていない
      # （モデルパックの照合と EXPECTED_MODEL_VERSION が使っている。
      # docs/model-pack.md）。`tracing` と `log` は使い続けるファサードである。
      #
      # 見るのは `--features candle` のツリー、つまり**出荷する構成**である
      # （既定ツリーはこれの部分集合なので、こちらだけで足りる）。ビルドは要らない。
      # **advisory・ライセンス・出どころはここでは見ない。**あれは supply chain
      # ジョブ（deny.toml）の仕事。ここが答えるのは「手書きに置き換えた依存が
      # うちの依存として戻っていないか」だけで、出荷ツリーと既定ツリーを別々に
      # 見るためにこちらに残してある（理由は deny.toml の `[bans]`）。
      - name: check the shipped dependency tree
        shell: bash
        run: |
          set -euo pipefail
          # 出荷ツリー（`--features candle`）に戻ってはいけないもの。
          #
          # tower-lsp-server / tokio / dashmap と、取らなかった lsp-types は
          # 1 つの変更で外れたものなので 1 つの一覧で見る（#78）。**lsp-types が
          # ここに居るのが要点**で、あれは「戻ってきた」ではなく「LSP の型を
          # 自分で書くのをやめた」の印になる（crates/codegloss-lsp/src/ls_types.rs）。
          # 引き連れて消えた 30 個（ls-types / fluent-uri / futures 系 / tower 系
          # / parking_lot 系 …）は結果であって原因ではないので入れない。
          banned_shipped="tracing-subscriber tower-lsp-server lsp-types tokio dashmap"
          # 既定ツリーだけで見るもの。**`thiserror` は出荷ツリーからは消えない**
          # ——candle-core / candle-nn / tokenizers が引いているため（実測）。
          # 見られるのは「こちらの直接依存として戻っていないか」だけで、
          # それが既定ツリーで測る理由である（#78）。
          banned_default="thiserror"

          # 名前だけの一覧にする。`--prefix none` なので 1 行 1 クレートで、
          # 第 1 語が名前、第 2 語が版になる。
          names() {
            cargo tree -p codegloss-lsp "$@" -e normal --prefix none \
              | awk '{print $1}' | sort -u
          }
          shipped=$(names --features candle)
          default=$(names)
          [ -n "$shipped" ] && [ -n "$default" ] || {
            echo "NG: 依存ツリーを読み取れませんでした" >&2
            exit 1
          }

          found=0
          check() {
            local tree=$1 what=$2 crates=$3
            for crate in $crates; do
              echo "$tree" | grep -qx "$crate" || continue
              echo "NG: $crate が${what}に戻っています。手書きに置き換えたものです" >&2
              echo "    tracing-subscriber → crates/codegloss-lsp/src/logging.rs" >&2
              echo "    thiserror          → codegloss-parser の Display / Error 実装" >&2
              echo "    lsp-types          → crates/codegloss-lsp/src/ls_types.rs" >&2
              echo "    tower-lsp-server   → src/server.rs と src/client.rs（枠は lsp-server）" >&2
              echo "    tokio              → crossbeam-channel と std::thread" >&2
              echo "    dashmap            → RwLock<HashMap>（src/documents.rs）" >&2
              echo "    引き直すなら先にそちらを消すこと。" >&2
              found=1
            done
          }
          check "$shipped" "出荷ツリー" "$banned_shipped"
          check "$default" "既定ツリー" "$banned_default"
          [ "$found" -eq 0 ] || exit 1

          echo "OK: 出荷ツリー $(echo "$shipped" | wc -l) / 既定ツリー $(echo "$default" | wc -l) クレートで、禁止したものは入っていません"

      # 仮想マニフェストに対する `--features candle` は、その名前の feature を
      # 持つメンバ全部に効く。codegloss-translator（marian / candle）と
      # codegloss-lsp（model_pack）の両方がここで入る。片方だけ名指しして
      # codegloss-lsp/candle と書いても同じ集合になる（あちらの candle が
      # codegloss-translator/candle を引くため）が、それは依存の向きに寄りかかる
      # 書き方で、lsp が翻訳エンジンを直に持たなくなった日に黙って translator を
      # 覆わなくなる。見たいのは「ワークスペースを candle 付きで回す」ことなので、
      # 依存ではなく feature の名前で言う。
      - name: clippy
        run: cargo clippy --workspace --all-targets --features candle -- -D warnings

      - name: test
        run: cargo test --workspace --features candle

      # 上の test が緑でも、marian のテストが 1 件も入っていなければ意味がない。
      # #60 と #66 が見つけたのはどちらも「走ると書いてあるのに走っていない」
      # テストで、required-features を足し直す・モジュールを別の cfg の裏へ移す
      # といった変更で同じことがまた起きる。そのときテストは消えず、ただ数が
      # 0 になるだけなので、ジョブは緑のままになる。名前が消えたらここで落とす。
      - name: check the fork guards ran
        shell: bash
        run: |
          set -euo pipefail
          # コードの字面ではなくテストバイナリに訊く。grep では #[cfg] で
          # 外された名前も数えてしまう。**選び方は上の test と 1 字も変えない**
          # ——`-p codegloss-translator` に絞るとワークスペース全体とは feature の
          # 統合結果が変わり、依存を積み直して実測 25 秒かかるうえ、数えるのが
          # 「さっき走ったのとは別のビルド」になる。揃えれば 0.5 秒で、走った
          # バイナリそのものに訊くことになる。
          guards=$(cargo test -q --workspace --features candle -- --list \
            | sed -n 's/^\(marian::tests::[A-Za-z0-9_]*\): test$/\1/p')
          [ -n "$guards" ] || {
            echo "NG: marian::tests が 1 件も入っていません。" >&2
            echo "    フォークの 3 つの変更を守るテストが走っていないので、" >&2
            echo "    上流と diff を取れることを確かめる手立てがありません（#66）。" >&2
            exit 1
          }
          echo "OK: フォークを守るテストが $(echo "$guards" | wc -l) 件走りました"
          echo "$guards"

  wasm:
    name: zed extension (wasm)
    runs-on: ubuntu-latest
    # 毎日の回で見たいのは supply chain だけ。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # ルート直下の rust-toolchain.toml にも入っているが、editors/zed は
          # ルート直下ではないので明示しておく方が壊れにくい。
          target: wasm32-wasip2
          # このアクションのキャッシュ入力は cache-workspaces（Swatinem/rust-cache
          # の workspaces にそのまま渡される）。editors/zed はルートワークスペース
          # から exclude されているので、ここを指さないとキャッシュが当たらない。
          cache-workspaces: editors/zed

      # editors/zed はルートワークスペースから exclude されているため、
      # check ジョブの fmt / clippy では見られない。ここで見る。
      - name: fmt
        working-directory: editors/zed
        run: cargo fmt --all -- --check

      - name: clippy
        working-directory: editors/zed
        run: cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings

      # Zed のビルダと同じく、拡張ディレクトリを作業ディレクトリにして
      # wasm32-wasip2 向けにビルドする。Zed 側でだけ失敗する事故を防ぐ。
      - name: build
        working-directory: editors/zed
        run: cargo build --target wasm32-wasip2 --release

      # wasip2 はパッケージ名の `-` を `_` に正規化する。
      - name: check artifact
        run: test -f editors/zed/target/wasm32-wasip2/release/codegloss_zed.wasm

  # 上の wasm ジョブは rust-toolchain.toml の版（開発用の最新）でしかビルドしない。
  # 拡張をビルドするのは Zed のレジストリで、向こうはうちより古い rustc を使う。
  # そこで、宣言した rust-version でも通ることをここで見る。
  #
  # このジョブが捕まえるのは「rust-version を据え置いたまま、新しい版でしか
  # 通らない書き方をした」場合である。**逆は捕まえられない**：rust-version を
  # 上げてしまった場合はその版でビルドして通ってしまう。レジストリ側の rustc が
  # いくつかは、このリポジトリからは分からないため。上げるときは
  # editors/zed/Cargo.toml のコメントを読むこと。
  msrv:
    name: zed extension (msrv)
    runs-on: ubuntu-latest
    # 毎日の回で見たいのは supply chain だけ。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      # 版を書く場所は増やさない。Cargo.toml の rust-version をそのまま使う。
      - name: read the declared rust-version
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' editors/zed/Cargo.toml | head -1)
          [ -n "$version" ] || {
            echo "NG: editors/zed/Cargo.toml に rust-version がありません" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "declared rust-version: $version"

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          target: wasm32-wasip2
          cache-workspaces: editors/zed

      # RUSTUP_TOOLCHAIN で明示するのが要点。これが無いと、cargo が上へ辿って
      # ルートの rust-toolchain.toml を拾い、結局そちらの版でビルドしてしまう。
      # 文字列は setup に渡したものと同じにする（`1.88` と `1.88.0` は rustup に
      # とって別のツールチェーンで、後者には wasm ターゲットが入っていない）。
      - name: build
        working-directory: editors/zed
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo build --target wasm32-wasip2 --release

  # editors/vscode は Cargo ワークスペースの外にあり、TypeScript なので上の
  # どのジョブも見ない。型検査・テスト・パッケージまでここで見る。
  #
  # package まで走らせるのは、VSIX が作れなくなる壊れ方が .vscodeignore と
  # package.json 側にあり、コンパイルでは出ないからである。ここで作るのは
  # target 無しの VSIX（サーバのバイナリを同梱しない形）で、リリースで配る
  # 5 つとはファイルの中身が違う。**サーバは取りに行かないこと**——CI で
  # リリースアセットを落とす理由は無く、同梱の有無はここの関心ではない。
  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    # 毎日の回で見たいのは supply chain だけ。
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      # ci であって install ではない。package-lock.json のとおりに入れ、
      # 合っていなければ落ちる。
      - name: install
        working-directory: editors/vscode
        run: npm ci

      - name: typecheck
        working-directory: editors/vscode
        run: npm run typecheck

      - name: test
        working-directory: editors/vscode
        run: npm test

      - name: package
        working-directory: editors/vscode
        run: npm run package

      - name: check artifact
        working-directory: editors/vscode
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test -f "codegloss-$version.vsix"

  # 依存の脆弱性・ライセンス・出どころを見る（#81）。設定は deny.toml で、
  # **何をなぜ許しているかはあちらに書いてある。**
  #
  # **ビルドしない**ので他のジョブと独立に速く終わり、Rust のツールチェーンも
  # 要らない。action は cargo-deny 本体と**同じ publisher**（EmbarkStudios）
  # なので、道具を信頼すると決めた時点より信頼の起点は増えない——サプライ
  # チェーンの検査にサードパーティを足す、という筋の悪さを避けてある。
  # 手で入れると実測 2 分 24 秒かかる（`cargo install --locked cargo-deny`）。
  #
  # **「手書きに置き換えた依存が戻っていないか」はここでは見ない。**あちらは
  # candle ジョブの `check the shipped dependency tree` の仕事で、理由は
  # deny.toml の `[bans]` に書いた（要点: cargo-deny は全ターゲットを見るので、
  # うちが配る 5 構成に絞ろうとするとビルド行列の写しが 3 枚目になる）。
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
