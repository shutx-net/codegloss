name: Release

# タグを打つとリリースが公開される。タグを打つ前に、Actions タブの Run workflow
# から通しで回せる（**書庫を集めてチェックサムを作るところまで走り**、リリース
# だけ作らない）。**新しい構成を足したらまずそちらで回すこと。**1 つでも落ちる
# タグは、消して打ち直すしかない。
on:
  push:
    # `+` は直前の文字の 1 回以上の繰り返し、`.` はそのままの文字。
    # `v0.1` や `v1.0.0-rc1` はここで弾かれ、何も起きない。何も起きないのは
    # 分かりにくいので、通ってしまった形は verify-versions.sh が落とす。
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

# リリースの作成とアセットのアップロードに要る。ビルドだけの回でも同じ
# ワークフローなので、ここで一度に宣言する。
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ビルドの前に置く。版がずれたタグで 5 構成 8 分を待たされるのは高い。
  version:
    name: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版は 3 か所にあり、全部同じでなければならない。ずれたまま配ると、
      # 拡張が存在しない版のバイナリを探しに行く。
      #
      # タグの形式もここで見る。上の絞り込みは「当てはまらないと何も
      # 起きない」ので、間違いに気づけない。通ってしまった形はここで落とす。
      - name: check the declared versions and the tag
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "NG: $1" >&2; exit 1; }

          # [workspace.package] の次の [ までを切る。ファイル全体を見ると
          # [workspace.dependencies] 側の version= を拾ってしまう。
          workspace=$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"$/\1/p' | head -1)
          crate=$(sed -n '/^\[package\]/,/^\[/p' editors/zed/Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"$/\1/p' | head -1)
          # extension.toml の version はどのテーブルよりも前にある。
          extension=$(sed -n '1,/^\[/p' editors/zed/extension.toml \
            | sed -n 's/^version *= *"\(.*\)"$/\1/p' | head -1)
          # VS Code 拡張はサーバのバイナリを VSIX に同梱するので、ここがずれると
          # 拡張と中のサーバが別の版になる。Zed 側がタグでバイナリを取りに行く
          # のと同じ拘束で、こちらは「取りに行く先」ではなく「入っているもの」。
          vscode=$(node -p 'require("./editors/vscode/package.json").version')

          [ -n "$workspace" ] || fail "Cargo.toml から版を読み取れませんでした"
          [ "$crate" = "$workspace" ] ||
            fail "editors/zed/Cargo.toml は $crate、ワークスペースは $workspace"
          [ "$extension" = "$workspace" ] ||
            fail "editors/zed/extension.toml は $extension、ワークスペースは $workspace"
          [ "$vscode" = "$workspace" ] ||
            fail "editors/vscode/package.json は $vscode、ワークスペースは $workspace"

          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            # case のパターンに繰り返しは書けない。v[0-9]*.[0-9]*.[0-9]* だと
            # 末尾の * が何でも拾い、v1.0.0-rc1 を通してしまう。3 つに分ける。
            bad() { fail "タグ $tag の形式が v<major>.<minor>.<patch> ではありません"; }
            case "$tag" in v*.*.*) ;; *) bad ;; esac
            case "${tag#v}" in *[!0-9.]*) bad ;; esac
            case "${tag#v}" in *.*.*.* | .* | *. | *..*) bad ;; esac
            [ "${tag#v}" = "$workspace" ] ||
              fail "タグ $tag に対して、宣言されている版は $workspace です"
            echo "OK: 版は $workspace（タグ・ワークスペース・拡張 2 つのすべて）"
          else
            echo "OK: 版は $workspace（ワークスペースと拡張 2 つ）"
          fi

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      # 1 つが落ちても残りの結果は見たい。どれが通ってどれが落ちるかが
      # 分からないと、直す順番が決められない。
      fail-fast: false
      matrix:
        include:
          # Linux は 22.04 で作る。ビルドした環境より新しい glibc は要求
          # できないので、古いほうで作ったバイナリのほうが広く動く。
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          # macOS のランナーは arm64。x86_64 は同じランナーからクロスで作る
          # （Xcode が両方の SDK を持っているので追加の設定は要らない）。
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v7

      # CI と同じく toolchain 入力は書かない。rust-toolchain.toml が唯一の版の
      # 定義であり、ここに書くと二重管理になる。target だけ足す。
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      # `--features candle` が本番の構成。これを外したバイナリは英語しか
      # 出せないので、リリースに載せる意味がない。
      - name: build
        run: cargo build --release -p codegloss-lsp --features candle --target ${{ matrix.target }}

      - name: package (unix)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          name="codegloss-lsp-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/codegloss-lsp" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"

      - name: package (windows)
        if: matrix.runner == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          name="codegloss-lsp-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/codegloss-lsp.exe" "dist/$name/"
          cp LICENSE README.md "dist/$name/"
          (cd dist && 7z a "$name.zip" "$name")

      # サーバが起動して版を名乗るところまでは、作ったその場で見る。実行
      # できないバイナリを配ってしまう事故は、これだけで防げる。
      # クロスで作ったものは動かせないので飛ばす。
      - name: smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/codegloss-lsp"
          if [ -f "$binary.exe" ]; then
            binary="$binary.exe"
          fi
          # モデルパックは無いので Passthrough になる。見たいのは「起動して、
          # engine を選んで、stdin が閉じたら終わる」ことだけ。判定はログで
          # するので、終了コードは問わない。
          printf '' | "$binary" > log 2>&1 || true
          cat log
          grep -q "starting" log

      # v4 は Node 20 で、ランナーが Node 24 に載せ替えて警告を出す。
      - uses: actions/upload-artifact@v7
        with:
          name: codegloss-lsp-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  # VS Code 拡張はプラットフォームごとに VSIX を作り、サーバのバイナリを
  # その中に同梱する。VS Code 1.61 以降が自分の OS と CPU に合うものを選ぶ。
  #
  # 起動時にリリースから落とす形（Zed 拡張がやっていること）にしなかったのは、
  # そうすると **ビルド行列の target 名とアセット名の対応表が TypeScript にも
  # う 1 枚できる**からである。同梱なら、その表はこのジョブの中の 1 箇所で済む。
  # 落とす処理も要らず、オフラインで動き、拡張とサーバの版が構造的にずれない。
  #
  # **ビルド行列に構成を足したら、下の targets にも足すこと。**足し忘れると
  # そのプラットフォームには target 無しの VSIX が当たり、拡張はサーバを
  # 見つけられずにその旨を出して終わる（起動はする）。
  vsix:
    name: vscode extension packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - uses: actions/download-artifact@v8
        with:
          path: servers
          merge-multiple: true

      - name: install
        working-directory: editors/vscode
        run: npm ci

      # 束ねるのは 1 回でよい。VSIX ごとに違うのは同梱するバイナリだけで、
      # dist/extension.js は 5 つとも同じものである。
      - name: compile
        working-directory: editors/vscode
        run: npm run compile

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./editors/vscode/package.json").version')
          mkdir -p vsix

          # 左が上のビルド行列の target、右が vsce の --target。
          targets="
          x86_64-unknown-linux-gnu  linux-x64
          aarch64-unknown-linux-gnu linux-arm64
          x86_64-apple-darwin       darwin-x64
          aarch64-apple-darwin      darwin-arm64
          x86_64-pc-windows-msvc    win32-x64
          "

          while read -r rust vsce; do
            [ -n "$rust" ] || continue

            # 前の周回のバイナリを残さない。残すと、展開に失敗した構成に
            # 別のプラットフォームのサーバが入った VSIX ができてしまう。
            rm -rf editors/vscode/server
            mkdir -p editors/vscode/server

            stem="codegloss-lsp-$rust"
            if [ -f "servers/$stem.tar.gz" ]; then
              # 書庫の中は $stem/ の 1 階層下。--strip-components でそれを外す。
              tar -xzf "servers/$stem.tar.gz" -C editors/vscode/server \
                --strip-components=1 "$stem/codegloss-lsp"
            elif [ -f "servers/$stem.zip" ]; then
              unzip -j -o "servers/$stem.zip" "$stem/codegloss-lsp.exe" \
                -d editors/vscode/server
            else
              echo "NG: $stem の書庫がありません" >&2
              exit 1
            fi

            # tar は実行ビットを保つが、zip から出したものは保たない。VSIX の
            # 中で実行ビットが落ちていると、利用者の環境で spawn が EACCES で
            # 落ちる——作った側からは見えない壊れ方なので、ここで揃える。
            chmod +x editors/vscode/server/*

            (cd editors/vscode && npx vsce package --no-dependencies \
              --target "$vsce" --out "../../vsix/codegloss-$version-$vsce.vsix")
          done <<< "$targets"

          rm -rf editors/vscode/server
          ls -l vsix

      - uses: actions/upload-artifact@v7
        with:
          name: codegloss-vsix
          path: vsix/*.vsix
          if-no-files-found: error

  release:
    name: collect, and release on a tag
    needs: [build, vsix]
    runs-on: ubuntu-latest
    # ここは常に走る。集める・数える・照合するまでを、タグを打つ前に
    # 一度でも通しておきたいから。実際に公開する step だけがタグ限定。
    steps:
      - uses: actions/checkout@v7

      # v4 は Node 20。upload 側と揃えて Node 24 のものにする。
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          # SHA256SUMS 自身を数えないよう、書庫だけを名指しする。nullglob が
          # 無いと、当たらなかったパターンがそのまま引数になって落ちる。
          shopt -s nullglob
          sha256sum -- *.tar.gz *.zip *.vsix > SHA256SUMS
          test -s SHA256SUMS
          cat SHA256SUMS

      # タグと Cargo.toml の版がずれたまま配ると、あとから何が入っている
      # のか分からなくなる。ここで止めるほうが、消して打ち直すより安い。
      # 公開する。タグを打つこと自体が「配る」という判断なので、そのあとに
      # もう一段の手作業を挟まない。中身の確認は、ここに来るまでの version /
      # smoke test / チェックサムが受け持つ。
      - name: create the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
