id = "codegloss-lsp"
name = "CodeGloss"
description = "Shows Japanese translations of English code comments in the editor"
version = "0.0.3"
schema_version = 1
authors = ["shutx <169037737+shutx-net@users.noreply.github.com>"]
repository = "https://github.com/shutx-net/codegloss"

# テーブルキー（codegloss）がそのまま language server id になる。Zed の
# settings.json でも "lsp": { "codegloss": ... } と書く。name は表示名。
# **上の id（codegloss-lsp）とは別物。**あちらはレジストリでの拡張の id で、
# 「language server しか提供しない拡張は -lsp を付けろ」という規約に合わせてある。
# こちらを変えると利用者の settings.json が壊れる。
#
# languages の値は Zed 側の言語名と一致させる必要がある。Rust と Go はどちらも
# Zed 本体に組み込まれていて、名前は zed main の
# crates/grammars/src/{rust,go}/config.toml の name で確認した（"Rust" / "Go"）。
# LSP に送られる languageId はそれを小文字にしたもの（LanguageName::lsp_id()）で、
# codegloss-parser の from_lsp_language_id はその値を受ける。
# **ただし実機で当たることは未確認**——確認欄は docs/zed-display-notes.md 2.6。
# 他の言語は別の拡張が提供するため、対応言語を増やす段階で実機確認してから足す。
#
# **この一覧を触ったら codegloss-parser の SupportedLanguage::ALL も触ること。**
# 別ワークスペースなのでどちらのビルドも相手を見ず、片方だけ足すと両方向に静かに
# 壊れる。CI の `check the supported-language lists`（.github/workflows/ci.yml）が
# 小文字化した集合で突き合わせている（#63）。
[language_servers.codegloss]
name = "CodeGloss"
languages = ["Rust", "Go"]

# Zed は capability に載っていない URL の `download_file` を拒む
# （`capability_granter.grant_download_file`）。これが無いと拡張はサーバを
# 落とせない。レジストリの要件というだけではなく、**無いと実行時に失敗する**。
# dev extension でも同じく失敗する。
#
# 自分のリリースアセットだけに絞ってある。リリースアセットの `download_url` は
# GitHub の `browser_download_url`、つまり
# `https://github.com/shutx-net/codegloss/releases/download/<tag>/<asset>` なので、
# 固定の 4 つがタグより前のすべて。
[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["shutx-net", "codegloss", "releases", "download", "**"]
