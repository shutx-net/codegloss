[package]
name = "codegloss-zed"
description = "CodeGloss の Zed 拡張"
version = "0.0.1"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/shutx-net/codegloss"
publish = false

# ルートの Cargo ワークスペースから独立させる。Zed のビルダはこのディレクトリを
# 作業ディレクトリにして `cargo build --target wasm32-wasip2` を実行するため、
# ホストターゲット向けの通常ビルドと同じワークスペースに置かない。
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = "0.7.0"
