[package]
name = "codegloss-translator"
description = "trait Translator と、その実装（差し替え可能な翻訳エンジン）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# IMPORTANT: このクレートは codegloss-core にしか依存しない。前処理・後処理・
# キャッシュを Translator 実装の中に書かないこと（AGENTS.md）。エンジンを
# 差し替えたときに一緒に失われるため、それらは codegloss-core に置く。
[dependencies]
anyhow.workspace = true
codegloss-core = { path = "../codegloss-core" }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

# IMPORTANT: candle は既定に入れない。既定の `cargo build` / `cargo test` が
# candle 無しで通ることを維持する（ビルドが数分伸びるのを CI に持ち込まない）。
# 実モデルを使うときだけ `--features candle` を付ける。
[features]
default = []
candle = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:serde",
    "dep:serde_json",
    "dep:tokenizers",
    "dep:tracing",
]

# メモリとレイテンシの実測はテストではなく example に置いてある。テストハーネスは
# #[ignore] のテストを 1 プロセス内で並列に走らせるため、モデルを読むテストが
# 同時に何本も動き、RSS がその合計になってしまう（P8 で判明）。
[[example]]
name = "measure"
required-features = ["candle"]

# 訳文そのものを見るための診断ツール。measure が「いくらかかるか」を出すのに対し、
# probe は「何と答えるか」を出す。実モデルが要るので candle の裏に置く。
[[example]]
name = "probe"
required-features = ["candle"]

# quality / placeholders は実モデル（モデルパック）が要るので #[ignore] 付き。
# CODEGLOSS_MODEL_PACK が指すパックに対して `-- --ignored` で走らせる。
[[test]]
name = "quality"
required-features = ["candle"]

[[test]]
name = "placeholders"
required-features = ["candle"]

# 探索そのもの（KV キャッシュの並べ替えと打ち切り）を見るテスト。
[[test]]
name = "decoding"
required-features = ["candle"]
