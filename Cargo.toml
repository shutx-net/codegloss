# CodeGloss の Cargo ワークスペース。
#
# editors/zed（Zed 拡張）は exclude している。Zed のビルダは拡張ディレクトリを
# current_dir にして `cargo build --target wasm32-wasip2 --target-dir <ext>/target`
# を実行するため、ホストターゲット向けの通常ビルドとは分けておく。
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["editors/zed"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/shutx-net/codegloss"

# 各クレートは `<crate>.workspace = true` でここから引く。版の指定はここ 1 箇所。
[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
# feature = "candle" のときだけ引く。既定のビルドとテストは candle 無しで通す
# （CI を重くしないため。AGENTS.md の「翻訳ランタイムは v0.1 では candle」は
# 実行時の話であって、既定のビルドに含める意味ではない）。
candle-core = "0.11"
candle-nn = "0.11"
sha2 = "0.10"
# platform-verifier は OS の証明書ストアを使う。webpki-roots（コンパイル時に
# 埋め込む集合）だと、TLS を傍受するプロキシの下で UnknownIssuer になる。
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
# lsp-server のチャネルと同じ版。ワーカーのキュー・エンジン差し替えの通知・
# サーバ発リクエストの待ち合わせに使う（tokio の mpsc / watch / time を
# これと std::thread に置き換えた）。
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JSON-RPC の枠と stdio だけ。LSP の型は持たないので、こちらが使う面は
# crates/codegloss-lsp/src/ls_types.rs に自分で書いてある。
lsp-server = "0.10"
# `log` ファサード経由の記録を自前の Logger へ橋渡しするために要る
# （crates/codegloss-lsp/src/logging.rs）。実測は同クレートの Cargo.toml。
# std feature: `set_boxed_logger` と `impl Log for Arc<T>`（Subscriber と同じ 1 つの
# Logger を両方の registry に入れるため）。既定 feature は空なのでどちらも無い。
log = { version = "0.4", features = ["std"] }
# facade だけ。**subscriber はここには無い**——1 行を組み立てて stderr へ書くのも
# `CODEGLOSS_LOG` を読むのも crates/codegloss-lsp/src/logging.rs が自前でやるので、
# tracing-subscriber は引かない（出荷ツリーから 7 クレート減った。戻すと CI の
# `check the shipped dependency tree` が落ちる）。
#
# **tower-lsp-server を外したので「どのみち引かれる」ではなくなった。**外すと
# 既定ツリーから 5 つ（tracing / tracing-attributes / tracing-core / once_cell /
# pin-project-lite）減るが、**出荷ツリーからは 1 つも減らない**——candle 側の
# codegloss-translator が引いているため。53 箇所の記録を書き換えて logging.rs の
# Subscriber 側を捨てても出荷ツリーが変わらないので、やっていない（#78 の
# thiserror と同じ形の測定結果）。
tracing = "0.1"
# Tokenizer::from_file で FuguMT の tokenizer.json を読む。既定 feature の
# esaxx_fast は C++ のビルドを、progressbar は indicatif を引くのでどちらも切る。
# onig は Regex 実装として必須（無効にすると tokenizers 自体がコンパイルできない）。
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
# tree-sitter 0.26 が受け付けるグラマーの ABI は 13〜15。tree-sitter-rust 0.24 は 15。
# 新しいグラマーを足すときは src/parser.c の LANGUAGE_VERSION を確認する。
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
# Zig。1.1.2 の src/parser.c は ABI 14。crates.io の最新はこの 1.1.2（2024-12）で、
# 上流 master は ABI 15 に上がっているが版として出ていない。**owner が
# tree-sitter-grammars で、信頼の起点が 1 つ増える**（上の 4 つの文法の owner は
# すべて tree-sitter）。crates.io には arborium-zig（bearcove）もあるが、あれは
# 同じ上流の master を生成し直した再配布で、取っても起点が 1 つ増えるのは同じ
# なので、上流が自分で出しているものを取る。
tree-sitter-zig = "1.1"
